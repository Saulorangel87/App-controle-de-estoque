<!doctype html>
<!-- lang="pt-BR" ajuda leitores de tela e mecanismos de busca a identificar o idioma correto -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Manifesto PWA: nome, ícones e display "standalone" são o que faz o
         Chrome oferecer "Instalar app" de forma confiável. -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS/Safari não lê manifest.json para o ícone da tela inicial — precisa
         desse link específico. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO básico: título e descrição únicos, usados por buscadores e ao compartilhar o link -->
    <title>Controle de Estoque | Mantimentos de casa</title>
    <meta
      name="description"
      content="Controle o estoque de mantimentos da sua casa: cadastre itens, dê baixa no consumo e receba alertas quando algo estiver acabando."
    />
    <meta name="robots" content="noindex" />
    <!-- noindex: é um app pessoal, autenticado; não faz sentido indexar nos buscadores -->

    <!-- theme-color melhora a experiência em navegadores mobile (barra de status combinando com o app) -->
    <meta name="theme-color" content="#0f9d6b" />

    <!--
      Sem fontes externas (Google Fonts etc.) de propósito: usamos a pilha de fontes do
      próprio sistema operacional. Isso elimina uma requisição de rede inteira e evita
      atraso de renderização de texto (FOIT/FOUT), o que ajuda diretamente o LCP e o CLS
      no PageSpeed Insights.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
