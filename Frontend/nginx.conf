server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip reduz o tamanho dos arquivos transferidos — ajuda diretamente
    # a métrica de performance do PageSpeed Insights.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (gerados pelo Vite, ex: index-a1b2c3.js) podem
    # ter cache agressivo: se o conteúdo mudar, o nome do arquivo muda junto.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback de SPA: qualquer rota que não seja um arquivo real (ex: /login)
    # cai no index.html, e o react-router-dom assume o roteamento no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
