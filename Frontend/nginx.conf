server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança aplicados também às respostas de erro por causa do
    # modificador "always". O CSP permite os estilos inline usados pelo CSS
    # dinâmico do React, mas mantém scripts e conexões restritos às origens
    # necessárias ao app.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://estoque-api.devsaulo.com.br; worker-src 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip reduz o tamanho dos arquivos transferidos — ajuda diretamente
    # a métrica de performance do PageSpeed Insights.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (gerados pelo Vite, ex: index-a1b2c3.js) podem
    # ter cache agressivo: se o conteúdo mudar, o nome do arquivo muda junto.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://estoque-api.devsaulo.com.br; worker-src 'self'; manifest-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Fallback de SPA: qualquer rota que não seja um arquivo real (ex: /login)
    # cai no index.html, e o react-router-dom assume o roteamento no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
