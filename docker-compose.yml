services:
  backend:
    build:
      context: ./Backend
      dockerfile: ../Backend.Dockerfile
    container_name: estoque-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      # Domínio real do frontend em produção, para o CORS liberar exatamente essa origem.
      CORS_ORIGIN: "https://estoque.devsaulo.com.br"
      # Caminho dentro do volume abaixo — sobrevive a "docker compose up -d --build".
      DB_PATH: "/app/data/estoque.db"
    volumes:
      - ./data:/app/data
    ports:
      # Em produção, o workflow define APP_BIND_ADDRESS como o IP Tailscale
      # da VPS. O fallback localhost mantém o uso local fora da rede.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8090:8080"

  frontend:
    build:
      context: ./Frontend
      dockerfile: ../Frontend.Dockerfile
      args:
        # Precisa bater com o domínio real da API — é "gravado" no JavaScript
        # durante o build, então build args (não environment) é o jeito certo.
        VITE_API_URL: "https://estoque-api.devsaulo.com.br"
    container_name: estoque-frontend
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8092:80"
