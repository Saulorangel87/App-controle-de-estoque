# Workflow de CI/CD do Controle de Estoque
# É iniciado manualmente para evitar publicação automática em produção.
# Fase 1 (build-and-test) = CI: garante que backend e frontend buildam sem erro.
# Fase 2 (deploy)         = CD: se a Fase 1 passar, conecta na VM e atualiza o container.

name: Deploy Controle de Estoque

permissions:
  contents: read

concurrency:
  group: deploy-controle-estoque-main
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  # ---------- CI: build e checagem, sem tocar em produção ----------
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5" # confirmado no go.mod do projeto

      - name: Buildar e checar o backend (Go)
        working-directory: ./Backend # ajuste se a pasta tiver outro nome
        run: |
          go build ./...
          go vet ./...

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./Frontend/package-lock.json

      - name: Instalar dependências e buildar o frontend (React)
        working-directory: ./Frontend # ajuste se a pasta tiver outro nome
        run: |
          npm ci
          npm run build

  # ---------- CD: só roda se a CI acima passar ----------
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Conectar o runner à rede privada Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.VPS_HOST }}

      - name: Conectar na Oracle Cloud via SSH e atualizar o container
          # v1.2.5 (0ff4204d59e8e51228ff73bce53f80d53301dee2)
          uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd ~/apps/App-controle-de-estoque
            git pull --ff-only origin main
            sudo docker compose up -d --build
            curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:8090/health
            curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:8092/
