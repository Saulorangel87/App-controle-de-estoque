# Workflow de CI/CD do Controle de Estoque
# É iniciado manualmente para evitar publicação automática em produção.
# Fase 1 (build-and-test) = CI: garante que backend e frontend buildam sem erro.
# Fase 2 (deploy)         = CD: se a Fase 1 passar, conecta na VM e atualiza o container.

name: Deploy Controle de Estoque

permissions:
  contents: read

concurrency:
  group: deploy-controle-estoque-main
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  # ---------- CI: build e checagem, sem tocar em produção ----------
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5" # confirmado no go.mod do projeto
          cache-dependency-path: ./Backend/go.sum

      - name: Buildar e checar o backend (Go)
        working-directory: ./Backend # ajuste se a pasta tiver outro nome
        run: |
          go build ./...
          go vet ./...

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./Frontend/package-lock.json

      - name: Instalar dependências e buildar o frontend (React)
        working-directory: ./Frontend # ajuste se a pasta tiver outro nome
        run: |
          npm ci
          npm run build

  # ---------- CD: só roda se a CI acima passar ----------
  deploy:
    needs: build-and-test
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Conectar o runner à rede privada Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: ${{ secrets.VPS_HOST }}

      - name: Conectar na Oracle Cloud via SSH e atualizar o container
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          known_hosts="$temp_dir/known_hosts"
          private_key="$temp_dir/id_ssh"

          ssh-keyscan -T 10 -p 22 -t ed25519 "$SSH_HOST" > "$known_hosts"
          test -s "$known_hosts"

          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 {print $2}')"
          expected_fingerprint="$(printf '%s' "$SSH_FINGERPRINT" | tr -d '\r\n')"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::O fingerprint ED25519 apresentado pela VPS não corresponde ao valor esperado."
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" > "$private_key"
          chmod 600 "$private_key"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=60 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -i "$private_key" \
            -p 22 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd ~/apps/App-controle-de-estoque
          git pull --ff-only origin main
          sudo docker compose up -d --build

          aguardar_http() {
            local url="$1"
            local tentativas=20
            local tentativa=1

            while [ "$tentativa" -le "$tentativas" ]; do
              if curl --fail --silent --show-error --max-time 10 "$url"; then
                return 0
              fi

              echo "Tentativa $tentativa/$tentativas falhou para $url; aguardando o serviço iniciar..."
              sleep 3
              tentativa=$((tentativa + 1))
            done

            echo "Falha: o serviço não respondeu com sucesso dentro do tempo esperado: $url"
            return 1
          }

          aguardar_http http://127.0.0.1:8090/health
          aguardar_http http://127.0.0.1:8092/
          REMOTE
